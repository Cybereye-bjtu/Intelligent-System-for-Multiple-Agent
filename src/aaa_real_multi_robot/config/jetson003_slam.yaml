/**/slam_toolbox:
  ros__parameters:
    use_sim_time: false
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: jetson003/odom
    map_frame: jetson003/map
    base_frame: jetson003/base_link
    scan_topic: scan_mapping_filtered
    scan_share_topic: /localized_scan
    use_known_initial_poses: true
    robot_names: [hyzx001, jetson003]
    # Site-frame starts in metres/radians. hyzx001 is 0.30 m to the left.
    initial_poses_xy_yaw: [0.0, 0.30, 0.0, 0.0, 0.0, 0.0]
    publish_peer_transforms: false
    mode: mapping
    resolution: 0.05
    transform_publish_period: 0.05
    map_update_interval: 2.0
    minimum_time_interval: 0.10
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    transform_timeout: 0.50
    tf_buffer_duration: 30.0
    scan_queue_size: 10
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 8.0
    do_loop_closing: true
