/**/map_merge:
  ros__parameters:
    use_sim_time: false
    merging_rate: 1.0
    discovery_rate: 1.0
    estimation_rate: 0.2
    estimation_confidence: 0.8
    robot_map_topic: map
    robot_map_updates_topic: map_updates
    robot_namespace: ""
    # Retained for visual A/B comparison only. Its known-pose image compositor
    # does not preserve arbitrary Slam Toolbox OccupancyGrid origins.
    merged_map_topic: /swarm/map_mexplore
    world_frame: site_map
    known_init_poses: true

    # Same heading; hyzx001 is 0.30 m to the left (+Y) of jetson003.
    /hyzx001/map_merge/init_pose_x: 0.0
    /hyzx001/map_merge/init_pose_y: 0.30
    /hyzx001/map_merge/init_pose_z: 0.0
    /hyzx001/map_merge/init_pose_yaw: 0.0

    /jetson003/map_merge/init_pose_x: 0.0
    /jetson003/map_merge/init_pose_y: 0.0
    /jetson003/map_merge/init_pose_z: 0.0
    /jetson003/map_merge/init_pose_yaw: 0.0
