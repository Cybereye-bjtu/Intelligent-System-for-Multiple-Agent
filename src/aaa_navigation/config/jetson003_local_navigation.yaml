mqtt_path_receiver:
  ros__parameters:
    broker: ca15b49bc8b442638f0cade1e45585ce.s1.eu.hivemq.cloud
    port: 8883
    client_id: aaa-jetson003-path-edge
    username_env: HYZX_MQTT_USERNAME
    password_env: HYZX_MQTT_PASSWORD
    path_mqtt_topic: edge/jetson003/path
    path_ros_topic: /aaa/global_path_local
    output_frame: odom
    path_timeout: 0.80
    max_message_age: 1.50
    max_points: 2000

scan_preprocessor:
  ros__parameters:
    input_topic: /scan
    output_topic: /aaa/scan_filtered
    range_min: 0.10
    range_max: 10.0
    median_window: 3
    filter_rear_self_returns: false

vfh_controller:
  ros__parameters:
    scan_topic: /aaa/scan_filtered
    path_topic: /aaa/global_path_local
    nominal_cmd_topic: /aaa/cmd_vel_nominal
    map_frame: odom
    robot_frame: base_link
    control_frequency: 10.0
    # Live LD19 sampling showed an occasional 0.41 s gap during commissioning.
    scan_timeout: 0.60
    lookahead_distance: 0.30
    goal_tolerance: 0.15
    histogram_max_range: 3.0
    # danger = (histogram_max_range - range) / histogram_max_range.  With the
    # 3 m histogram range, 0.88 starts VFH blocking at roughly 0.36 m.  The
    # independent safety barrier still slows/stops the chassis at close range.
    obstacle_threshold: 0.88
    robot_width: 0.212
    valley_safety_margin_deg: 10.0
    max_linear_velocity: 0.10
    min_effective_linear_velocity: 0.04
    max_angular_velocity: 0.20
    max_linear_acceleration: 0.15
    max_angular_acceleration: 0.30
    max_angular_deceleration: 0.80
    angular_proportional_gain: 0.80
    align_enter_angle_deg: 25.0
    align_exit_angle_deg: 8.0
    heading_deadband_deg: 3.0
    pose_timeout: 0.20

safety_barrier:
  ros__parameters:
    scan_topic: /aaa/scan_filtered
    odom_topic: /odom
    nominal_cmd_topic: /aaa/cmd_vel_nominal
    output_cmd_topic: /aaa/cmd_vel_safe
    control_frequency: 20.0
    scan_timeout: 0.60
    command_timeout: 0.25
    odom_timeout: 0.50
    base_clearance: 0.16
    reaction_time: 0.40
    braking_deceleration: 0.30
    hard_stop_distance: 0.20
    slow_margin: 0.25
    allow_escape_rotation: false
    max_linear_velocity: 0.10
    max_angular_velocity: 0.20
    robot_frame: base_link

aaa_cmd_gateway:
  ros__parameters:
    input_topic: /aaa/cmd_vel_safe
    # The gateway is the sole chassis command publisher after cutover.  It
    # remains disabled until the fleet control plane explicitly enables it.
    output_topic: /cmd_vel
    control_frequency: 20.0
    command_timeout: 0.25
    max_linear_velocity: 0.10
    max_angular_velocity: 0.20
    enabled_on_start: false
